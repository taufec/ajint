name: Machine Admin

on:
  push:
    branches: [main]
    paths: [requests/current.sh]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run request on machine
        env:
          ADMIN_VPS_HOST: ${{ secrets.ADMIN_VPS_HOST }}
          ADMIN_VPS_PORT: ${{ secrets.ADMIN_VPS_PORT }}
          ADMIN_VPS_USER: ${{ secrets.ADMIN_VPS_USER }}
          ADMIN_VPS_SSH_KEY: ${{ secrets.ADMIN_VPS_SSH_KEY }}
          ADMIN_VPS_KNOWN_HOSTS: ${{ secrets.ADMIN_VPS_KNOWN_HOSTS }}
        run: bash scripts/run-admin.sh requests/current.sh

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: machine-admin-${{ github.run_id }}
          path: result/
          retention-days: 7
